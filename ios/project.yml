name: VCiPhone
options:
  bundleIdPrefix: com.vciphone
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.19.0

targets:
  VCiPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vciphone.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "リアルタイムボイスチェンジおよび参照音声録音のためにマイクを使用します。"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ENABLE_BITCODE: NO
